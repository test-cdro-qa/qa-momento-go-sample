
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: manual_approval
on:
  workflow_dispatch:
jobs:
  warm-up:
    steps:
      - name: Give the run status row time to land
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: echo "warm-up"
  ask-now:
    needs:
      - warm-up
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    timeout-minutes: 45
    with:
      instructions: Approve or reject this manual approval task.
      approvers:  ce19a514-7c3b-11f0-9922-42010a83ae54
      debug: true