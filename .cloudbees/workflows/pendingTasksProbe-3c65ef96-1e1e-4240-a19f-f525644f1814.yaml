apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: pending_tasks_probe
on:
  workflow_dispatch:
jobs:
  ask-now:
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    timeout-minutes: 20
    with:
      instructions: Probe pending tasks.
      notify-eligible-users: "true"
      debug: true